[project]
name = "arc-runtime"
version = "0.1.0"
description = "ARC realtime voice-agent runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# A hung cancellation path must fail the test, not hang CI.
timeout = 5

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ASYNC", "UP"]
